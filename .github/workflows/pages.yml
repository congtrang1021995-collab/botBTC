# Mỗi lần push lên main: chạy test Bot2, dựng trang live (web/build_site.py) và đăng lên GitHub Pages.
# Bật một lần: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Deploy Bot2 Live

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test Bot2
        run: python -m unittest discover -s tests
      - name: Build site
        run: python web/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
