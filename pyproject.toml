[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "investment-system-bot-2"
version = "0.1.0"
description = "Modular trading-system engine matching the Step 1-3 Pine Script specification."
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
include = ["trading_bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
